# Cloudflare Workers config, static-assets only — there is no server-side code,
# so no `main` entry point. `wrangler deploy` uploads ./dist and serves it.
#
# This was a Pages config (`pages_build_output_dir`) until Cloudflare's dashboard
# moved new projects to the Workers flow, whose deploy command is
# `npx wrangler deploy`. That command rejects a Pages config outright.
# _headers and _redirects work the same under Workers static assets.

name = "reachmck"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"
